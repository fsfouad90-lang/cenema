workflows:
  android-kotlin-workflow:
    name: Android Kotlin Build Workflow
    instance_type: linux
    max_build_duration: 30
    environment:
      vars:
        FIREBASE_API_KEY: "AIzaSyAj_d8RwAVYJMjCpibo--p21cORxPxJriw"
        FIREBASE_PROJECT_ID: "cenema-dz"
        FIREBASE_APP_ID: "1:782207947266:android:0d44193fc79632d43a8d1b"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Generate .env file for build
        script: |
          echo "FIREBASE_API_KEY=$FIREBASE_API_KEY" > .env
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> .env
          echo "FIREBASE_APP_ID=$FIREBASE_APP_ID" >> .env
      - name: Build Android Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
